services:
  - type: web
    name: spawnfluxo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
      # Endereço público do site, sem barra no final. Usado no cartão de
      # compartilhamento (og:url). Preencha com a URL que o Render gerar.
      - key: SITE_URL
        sync: false
