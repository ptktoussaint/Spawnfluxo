services:
  - type: web
    name: spawnfluxo
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "true"
    disk:
      name: spawnfluxo-data
      mountPath: /var/data
      sizeGB: 1
