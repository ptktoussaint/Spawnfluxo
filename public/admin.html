<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPAWNS FLUXO "BY PTK" — Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand-title">SPAWNS FLUXO <span class="credit">"BY PTK"</span> — Admin</h1>
    <a href="/index.html" class="back-link">← Voltar ao catálogo</a>
  </header>

  <main>
    <section id="login-section">
      <form id="login-form" class="card form">
        <h2>Login</h2>
        <label>Senha
          <input type="password" id="password" required autofocus>
        </label>
        <button type="submit">Entrar</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </section>

    <section id="admin-section" hidden>
      <div class="admin-toolbar">
        <button id="new-car-btn">+ Novo carro</button>
        <button id="logout-btn" class="secondary">Sair</button>
      </div>

      <div class="search-bar">
        <input id="admin-q" type="text" placeholder="Buscar por nome ou categoria...">
        <select id="admin-category">
          <option value="">Todas as categorias</option>
        </select>
      </div>
      <div id="admin-count" class="count"></div>

      <table id="car-table">
        <thead>
          <tr><th>Foto</th><th>Nome</th><th>Código</th><th>Categoria</th><th>Ações</th></tr>
        </thead>
        <tbody id="car-tbody"></tbody>
      </table>
    </section>
  </main>

  <script src="/js/admin.js"></script>
</body>
</html>
