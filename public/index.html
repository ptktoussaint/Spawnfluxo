<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPAWNS FLUXO "BY PTK"</title>
  <!-- As meta tags do cartão de compartilhamento entram aqui, montadas pelo
       servidor (veja lib/share-card.js). Os robôs de prévia do Discord,
       WhatsApp, Telegram e Slack não executam JavaScript, então elas precisam
       já vir prontas no HTML. -->
  <!--SHARE_META-->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="https://i.imgur.com/IoY8XvL.png" alt="" class="brand-logo">
      <div>
        <h1 class="brand-title">SPAWNS FLUXO <span class="credit">"BY PTK"</span></h1>
        <p class="subtitle" id="subtitle">Catálogo de códigos de spawn de veículos</p>
      </div>
    </div>
  </header>

  <main>
    <div class="tabs" id="tabs">
      <button type="button" class="tab-btn active" data-type="veiculo">Spawn de Veículos</button>
      <button type="button" class="tab-btn" data-type="item">Spawn de Itens</button>
    </div>

    <div class="search-bar">
      <input id="q" type="text" placeholder="Buscar por nome, código ou categoria...">
    </div>
    <div id="category-filters" class="category-filters"></div>

    <p id="load-error" class="error" hidden></p>
    <div id="count" class="count"></div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>Nenhum carro encontrado.</div>
  </main>

  <footer>
    <a href="/admin.html">Área administrativa</a>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
